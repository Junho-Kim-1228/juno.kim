limit_req_zone $binary_remote_addr zone=juno_admin_login:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name juno.kim 43.200.172.77;

    ssl_certificate /etc/letsencrypt/live/juno.kim/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juno.kim/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/juno-kim/frontend/dist;
    index index.html;

    access_log /var/log/nginx/juno-kim.access.log;
    error_log /var/log/nginx/juno-kim.error.log warn;

    server_tokens off;
    client_max_body_size 10m;
    limit_req_status 429;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://unix:/run/juno-kim/gunicorn.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /admin/login/ {
        limit_req zone=juno_admin_login burst=10 nodelay;
        proxy_pass http://unix:/run/juno-kim/gunicorn.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://unix:/run/juno-kim/gunicorn.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /var/www/juno-kim/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /var/www/juno-kim/backend/media/;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name juno.kim 43.200.172.77;

    if ($host = juno.kim) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
