name: Monitor production

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: juno-kim-production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Check juno.kim
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ALERT_TITLE: "[monitor] juno.kim availability alert"
    steps:
      - name: Check public endpoints and TLS certificate
        id: check
        shell: bash
        run: |
          set +e
          failures=()

          homepage_status="$(curl --silent --show-error --location --retry 2 --retry-all-errors --max-time 15 --output /dev/null --write-out '%{http_code}' https://juno.kim/)"
          if [[ "${homepage_status}" != "200" ]]; then
            failures+=("homepage returned HTTP ${homepage_status:-unknown}")
          fi

          health_body="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 15 https://juno.kim/api/v1/health/)"
          health_curl_status=$?
          if ((health_curl_status != 0)); then
            failures+=("health endpoint request failed")
          elif ! HEALTH_BODY="${health_body}" python -c 'import json, os, sys; sys.exit(0 if json.loads(os.environ["HEALTH_BODY"]) == {"status": "ok"} else 1)'; then
            failures+=("health endpoint returned an unexpected response")
          fi

          if ! timeout 20 openssl s_client -connect juno.kim:443 -servername juno.kim </dev/null 2>/dev/null \
            | openssl x509 -checkend 1209600 -noout >/dev/null; then
            failures+=("TLS certificate is invalid or expires within 14 days")
          fi

          if ((${#failures[@]} > 0)); then
            printf '%s\n' "${failures[@]}" > "${RUNNER_TEMP}/monitor-failures.txt"
            echo "healthy=false" >> "${GITHUB_OUTPUT}"
          else
            echo "healthy=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open or update an alert issue
        if: steps.check.outputs.healthy != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          existing_issue="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${ALERT_TITLE} in:title" --json number --jq '.[0].number // empty')"
          details="$(sed 's/^/- /' "${RUNNER_TEMP}/monitor-failures.txt")"
          body=$(printf 'Automated monitoring detected a production problem at %s.\n\n%s\n\n[Workflow run](%s)' \
            "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" "${details}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          if [[ -z "${existing_issue}" ]]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${ALERT_TITLE}" --body "${body}"
          fi
          exit 1

      - name: Close an alert issue after recovery
        if: steps.check.outputs.healthy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          existing_issue="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${ALERT_TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "${existing_issue}" ]]; then
            gh issue comment "${existing_issue}" --repo "${GITHUB_REPOSITORY}" --body "Monitoring recovered at $(date -u +'%Y-%m-%d %H:%M:%S UTC')."
            gh issue close "${existing_issue}" --repo "${GITHUB_REPOSITORY}" --reason completed
          fi
