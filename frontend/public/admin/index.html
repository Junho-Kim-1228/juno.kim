<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>여긴 아닌데…</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #050908;
        color: #e8f7ef;
        font-family: "Malgun Gothic", sans-serif;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, rgba(2, 7, 5, .32), rgba(2, 7, 5, .82));
        pointer-events: none;
      }
      .ghost {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: -1;
      }
      main {
        width: min(34rem, calc(100% - 2rem));
        margin-top: 28vh;
        padding: 1.4rem 1.6rem;
        text-align: center;
        background: rgba(5, 13, 9, .78);
        border: 1px solid rgba(159, 255, 211, .32);
        border-radius: 8px;
        box-shadow: 0 16px 45px rgba(0, 0, 0, .38);
      }
      h1 { margin: 0; font-size: clamp(1.45rem, 4vw, 2rem); font-weight: 500; }
      p { margin: .65rem 0 0; color: #b4d4c2; line-height: 1.7; }
      a { display: inline-block; margin-top: 1rem; color: #d8ffea; }
    </style>
  </head>
  <body>
    <img class="ghost" src="/admin/ghost.png" alt="">
    <main>
      <h1>여긴 아닌데…</h1>
      <p>무언가를 찾고 있었나요? 홈으로 돌아가세요.</p>
      <a href="/">juno.kim 홈으로</a>
    </main>
  </body>
</html>
